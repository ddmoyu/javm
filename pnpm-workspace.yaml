packages:
  - .

overrides:
  vite@*: npm:@voidzero-dev/vite-plus-core@1.1.0
  vitest@*: 5.0.3

# Vite+ core 的包版本为 1.1.0，提供 Vite 8 API。仅放行这组已锁定的别名版本。
peerDependencyRules:
  allowedVersions:
    "@vitejs/plugin-react@6.1.2>vite": 1.1.0
    "vitest@5.0.3>vite": 1.1.0

# CLI 的可选 WebSocket 加速器使用 JS 回退；es5-ext 的安装提示无需运行。
allowBuilds:
  bufferutil: false
  utf-8-validate: false
  es5-ext: false
