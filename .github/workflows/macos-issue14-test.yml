name: macOS Intel 闪退专项测试包

on:
  workflow_dispatch:

# 仅保存 Actions 附件；没有发布权限、标签推送或 Release 步骤。
permissions:
  contents: read

concurrency:
  group: macos-issue14-test-${{ github.ref }}
  cancel-in-progress: false

jobs:
  host:
    name: 独立构建并验证 Intel 宿主
    runs-on: macos-15-intel
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: 准备构建工具
        run: brew list --versions ninja >/dev/null || brew install ninja
      - name: 验证协议注册辅助函数
        run: node --test scripts/third-party/posix/cocoa-protocols.test.mjs
      - name: 构建并验证宿主组件（不发布）
        run: node scripts/third-party/posix/build.mjs neutralino
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: issue14-neutralino-macos-x64
          path: build/components-posix/macos-x64/deps-neutralino-*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  package:
    name: 生成 Intel 测试 APP 和 DMG
    needs: host
    runs-on: macos-15-intel
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: issue14-neutralino-macos-x64
          path: build/issue14-component
      - name: 校验组件并重打包 1.0.17，验证实际 ZIP 与 DMG
        run: node scripts/package-macos-issue14-test.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: JAVM-issue14-test-macos-x64
          path: dist/issue14-test/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
