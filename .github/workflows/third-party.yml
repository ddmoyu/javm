name: 第三方精简组件

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/third-party.yml
      - scripts/third-party/**
      - scripts/offline-dependencies.json
      - scripts/build-ffmpeg-lite.*
      - scripts/verify-ffmpeg-lite.mjs
      - scripts/build-metatube-lite.mjs
      - scripts/metatube-lite/**
      - scripts/metatube-lite-profile.mjs
      - scripts/verify-metatube-lite.mjs
      - scripts/build-curl.ps1
      - scripts/verify-mediainfo-lite.mjs
      - native/media/mediainfo/**
  workflow_dispatch:
    inputs:
      component:
        description: 要检查并构建的组件
        type: choice
        options: [all, ffmpeg, metatube, mediainfo, curl]
        default: all

permissions:
  contents: read

concurrency:
  group: third-party-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.plan.outputs.changed }}
      matrix: ${{ steps.plan.outputs.matrix }}
      components: ${{ steps.plan.outputs.components }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: 验证依赖管理逻辑
        run: node --test scripts/third-party/components.test.mjs
      - name: 按组件构建指纹跳过已有发布
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          COMPONENT: ${{ inputs.component || 'all' }}
          JAVM_RESERVE_COMPONENT_TAGS: "1"
        run: node scripts/third-party/release.mjs plan "$COMPONENT"

  build:
    needs: plan
    if: needs.plan.outputs.changed == 'true'
    runs-on: windows-2025
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      JAVM_COMPONENT_PLATFORM: ${{ matrix.platform }}
      COMPONENT: ${{ matrix.component }}
      JAVM_GIT_BASH: C:\Program Files\Git\usr\bin\bash.exe
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: matrix.component == 'metatube'
        with:
          go-version: "1.25.0"
          cache: false
      - name: 安装 FFmpeg 汇编工具
        if: matrix.component == 'ffmpeg'
        shell: pwsh
        run: |
          choco install nasm --version=2.16.03 --yes --no-progress
          if ($LASTEXITCODE -notin @(0,3010)) { throw 'NASM installation failed' }
          (Join-Path $env:ProgramFiles 'NASM') | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
      - name: 独立构建、验证与打包
        shell: pwsh
        run: ./scripts/third-party/build.ps1 -Component $env:COMPONENT
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: thirdparty-${{ matrix.component }}-${{ matrix.platform }}
          path: build/third-party-artifacts/${{ matrix.component }}/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  publish:
    needs: [plan, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        component: ${{ fromJSON(needs.plan.outputs.components) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: thirdparty-${{ matrix.component }}-*
          path: build/third-party-artifacts/${{ matrix.component }}
          merge-multiple: true
      - name: 发布组件并下载回读校验
        env:
          GH_TOKEN: ${{ github.token }}
          COMPONENT: ${{ matrix.component }}
        run: node scripts/third-party/release.mjs publish "$COMPONENT"
