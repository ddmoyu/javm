name: 自动更新签名密钥
on:
  workflow_dispatch:
  # 一次性初始化分支；普通分支与 PR 不自动运行。
  push:
    branches: [codex/update-signing-key]
    paths:
      - .github/workflows/update-signing-key.yml
      - scripts/update-key.mjs
      - resources/update-public-key.json
      - scripts/legacy-update.mjs
      - resources/legacy-update-public-key.json
permissions:
  contents: read
concurrency:
  group: javm-update-signing-key
  cancel-in-progress: false
jobs:
  key:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 准备 GitHub sealed box 加密库
        run: sudo apt-get update -qq && sudo apt-get install -y libsodium23
      - name: 初始化或验证更新签名
        env:
          JAVM_UPDATE_PRIVATE_KEY: ${{ secrets.JAVM_UPDATE_PRIVATE_KEY }}
          # 仓库 Actions 的公开加密密钥，仅用于一次性初始化。
          JAVM_ACTIONS_PUBLIC_KEY: Pewow781lHIzBA7s8i9E7wb8d9ia/ATpRzhO+HoTdzE=
          JAVM_ACTIONS_PUBLIC_KEY_ID: "3380204578043523366"
        run: node scripts/update-key.mjs bootstrap
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@v6.1.0
      - name: 验证旧版 Tauri 密钥仍可用于兼容升级
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: node scripts/legacy-update.mjs verify-key
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: javm-update-key-${{ github.run_id }}
          path: build/update-key/*.json
          if-no-files-found: error
          retention-days: 7
