name: macOS 与 Linux 桌面构建
on:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: desktop-posix-${{ github.ref }}
  cancel-in-progress: false
jobs:
  desktop:
    name: ${{ matrix.target }} 桌面
    permissions:
      contents: read
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: linux-x64, runner: ubuntu-24.04 }
          - { target: macos-arm64, runner: macos-15 }
          - { target: macos-x64, runner: macos-15-intel }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-project
        with:
          install: "false"
      - name: 核对发布标签来源
        if: startsWith(github.ref, 'refs/tags/v')
        run: node scripts/release-alpha.mjs verify-source
      - run: pnpm install --frozen-lockfile
      - name: 准备 Linux 构建依赖
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build libssl-dev libicu-dev libsecret-1-dev libgtk-3-dev libx11-dev libxrandr-dev libxtst-dev libxcb1-dev libpng-dev libwebkit2gtk-4.1-dev gstreamer1.0-libav gstreamer1.0-plugins-good gstreamer1.0-plugins-bad libayatana-appindicator3-dev patchelf squashfs-tools desktop-file-utils xvfb gnome-keyring dbus-x11 policykit-1
      - name: 准备 macOS 构建工具
        if: runner.os == 'macOS'
        run: |
          brew list --versions ninja >/dev/null || brew install ninja
      - name: 下载并校验已发布组件
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/third-party/posix/resolve.mjs
      - run: pnpm desktop:setup --verified-posix-host
      - name: 编译完整原生扩展
        id: native
        run: pnpm native:build --release --update-tests
      - name: 验证自动更新和数据回退安全夹具
        env:
          JAVM_UPDATE_FIXTURES: build/native/${{ runner.os == 'macOS' && 'macos-release' || 'linux-release' }}/update-fixtures
        run: node --disable-warning=ExperimentalWarning --test scripts/update-native.test.mjs
      - name: 验证旧库导入与发现页缓存修复
        env:
          JAVM_MEDIA_INTEGRATION: "1"
          JAVM_DATABASE_EXE: ${{ github.workspace }}/bin/javm_database
        run: pnpm exec vp test run tests/legacy-discovery-repair-native.integration.test.ts
      - name: 临时系统只授权本次 dpkg 夹具
        if: runner.os == 'Linux'
        run: |
          printf 'polkit.addRule(function(action, subject) { if (action.id == "org.freedesktop.policykit.exec" && action.lookup("program") == "/usr/bin/dpkg" && subject.user == "%s") return polkit.Result.YES; });\n' "$(id -un)" | sudo tee /etc/polkit-1/rules.d/49-javm-update-validation.rules >/dev/null
          sudo systemctl restart polkit
      - name: 验证 APP、AppImage、DEB 更新及故障回退
        env:
          JAVM_UPDATE_FIXTURES: build/native/${{ runner.os == 'macOS' && 'macos-release' || 'linux-release' }}/update-fixtures
        run: node --disable-warning=ExperimentalWarning --test scripts/update-platform.test.mjs
      - name: 验证系统凭据存储
        if: ${{ !cancelled() && steps.native.outcome == 'success' }}
        run: node scripts/verify-system-credentials.mjs
      - name: 验证系统证书与代理传输
        if: ${{ !cancelled() && steps.native.outcome == 'success' }}
        run: node scripts/verify-posix-network.mjs
      - name: 验证 Linux 链接关联
        if: ${{ !cancelled() && steps.native.outcome == 'success' && runner.os == 'Linux' }}
        run: node scripts/verify-linux-protocol.mjs
      - name: 验证 macOS 系统链接事件
        if: ${{ !cancelled() && steps.native.outcome == 'success' && runner.os == 'macOS' }}
        run: node scripts/verify-macos-protocol.mjs
      - name: 验证 Linux 安全桌面与媒体业务
        if: ${{ !cancelled() && steps.native.outcome == 'success' && runner.os == 'Linux' }}
        run: dbus-run-session -- xvfb-run -a node scripts/verify-posix-desktop.mjs
      - name: 验证 macOS 安全桌面与媒体业务
        if: ${{ !cancelled() && steps.native.outcome == 'success' && runner.os == 'macOS' }}
        run: node scripts/verify-posix-desktop.mjs
      - name: 打包前端与原生宿主
        id: bundle
        if: ${{ !cancelled() && steps.native.outcome == 'success' }}
        run: pnpm build && node scripts/build-desktop.mjs --no-archive
      - name: 生成安装包和便携包
        id: package
        if: ${{ !cancelled() && steps.bundle.outcome == 'success' }}
        run: node scripts/package-posix.mjs
      - name: 检查安装包与实际宿主
        if: ${{ !cancelled() && steps.package.outcome == 'success' }}
        run: node scripts/verify-posix-package.mjs
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-alpha.')
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/update/tests/legacy-tauri/target
          key: legacy-updater-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('native/update/tests/legacy-tauri/Cargo.lock') }}
      - name: 编译 0.5.3 原更新插件安全驱动
        if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-alpha.')
        run: cargo build --locked --manifest-path native/update/tests/legacy-tauri/Cargo.toml
      - name: 验证 0.5.3 到当前发布的签名安装与新宿主启动
        if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-alpha.')
        env:
          GH_TOKEN: ${{ github.token }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: node scripts/verify-legacy-upgrade.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-alpha.')
        with:
          name: javm-upgrade-${{ matrix.target }}
          path: build/legacy-upgrade-${{ matrix.target }}.json
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: javm-development-${{ matrix.target }}
          path: dist/posix-release/${{ matrix.target }}/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
