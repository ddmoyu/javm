name: macOS 与 Linux 桌面构建
on:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: write
jobs:
  desktop:
    name: ${{ matrix.target }} 组件与桌面
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: linux-x64, runner: ubuntu-24.04 }
          - { target: macos-arm64, runner: macos-15 }
          - { target: macos-x64, runner: macos-15-intel }
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: actions/setup-go@v6.1.0
        with:
          go-version: "1.25.0"
          cache: false
      - run: pnpm install --frozen-lockfile
      - name: 核对发布标签来源
        if: startsWith(github.ref, 'refs/tags/v')
        run: node scripts/release-alpha.mjs verify-source
      - name: 准备 Linux 构建依赖
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build nasm libssl-dev libicu-dev libsecret-1-dev libgtk-3-dev libx11-dev libxrandr-dev libxtst-dev libxcb1-dev libpng-dev libwebkit2gtk-4.1-0 gstreamer1.0-libav gstreamer1.0-plugins-good libayatana-appindicator3-1 patchelf squashfs-tools desktop-file-utils xvfb gnome-keyring dbus-x11
      - name: 准备 macOS 构建工具
        if: runner.os == 'macOS'
        run: |
          for formula in ninja nasm; do
            brew list --versions "$formula" >/dev/null || brew install "$formula"
          done
      - name: 构建、发布并回读校验精确配方组件
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/third-party/posix/resolve.mjs --publish-missing
      - run: pnpm desktop:setup --verified-posix-host
      - name: 编译完整原生扩展
        id: native
        run: pnpm native:build --release
      - name: 验证系统凭据存储
        if: ${{ !cancelled() && steps.native.outcome == 'success' }}
        run: node scripts/verify-system-credentials.mjs
      - name: 验证系统证书与代理传输
        if: ${{ !cancelled() && steps.native.outcome == 'success' }}
        run: node scripts/verify-posix-network.mjs
      - name: 验证 Linux 链接关联
        if: ${{ !cancelled() && steps.native.outcome == 'success' && runner.os == 'Linux' }}
        run: node scripts/verify-linux-protocol.mjs
      - name: 验证 macOS 系统链接事件
        if: ${{ !cancelled() && steps.native.outcome == 'success' && runner.os == 'macOS' }}
        run: node scripts/verify-macos-protocol.mjs
      - name: 验证 Linux 安全桌面与媒体业务
        if: ${{ !cancelled() && steps.native.outcome == 'success' && runner.os == 'Linux' }}
        run: dbus-run-session -- xvfb-run -a node scripts/verify-posix-desktop.mjs
      - name: 验证 macOS 安全桌面与媒体业务
        if: ${{ !cancelled() && steps.native.outcome == 'success' && runner.os == 'macOS' }}
        run: node scripts/verify-posix-desktop.mjs
      - name: 打包前端与原生宿主
        run: pnpm build && node scripts/build-desktop.mjs --no-archive
      - name: 生成安装包和便携包
        run: node scripts/package-posix.mjs
      - name: 检查安装包与实际宿主
        run: node scripts/verify-posix-package.mjs
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: javm-development-${{ matrix.target }}
          path: dist/posix-release/${{ matrix.target }}/*
          if-no-files-found: error
          retention-days: 14
